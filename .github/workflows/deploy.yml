name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates before anything ships. A red test must not reach Pages.
      - run: npx tsc --noEmit
      - run: npx vitest run

      - name: Build static export
        env:
          # Project pages serve from /<repo>, so every absolute asset URL needs
          # that prefix. Derived from the repo name rather than hardcoded.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npx next build

      # Without this, Pages runs Jekyll, which ignores directories starting
      # with an underscore and would drop the whole _next bundle.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
